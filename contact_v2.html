<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ติดต่อเจ้าหน้าที่ | Ban Klang Health</title>
<style>
  :root {
    --blue: #2196f3;
    --pink: #ec4899;
    --green: #4caf50;
    --text-dark: #1f2937;
    --text-gray: #6b7280;
    --border: #e5e7eb;
    --bg: #eaf4fb;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Segoe UI', 'Sarabun', 'Prompt', sans-serif;
    background: var(--bg);
    color: var(--text-dark);
  }

  .page {
    max-width: 480px;
    margin: 0 auto;
    padding: 24px 16px 40px;
  }

  .card {
    background: #fff;
    border-radius: 22px;
    padding: 36px 26px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    text-align: center;
  }

  .card h1 {
    font-size: 24px;
    margin: 0 0 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .divider {
    height: 1px;
    background: var(--border);
    margin: 0 0 26px;
  }

  .info-row {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    gap: 10px;
    font-size: 18px;
    color: var(--text-dark);
    margin-bottom: 20px;
    line-height: 1.5;
  }

  .info-icon { font-size: 22px; flex-shrink: 0; }

  .phone-number {
    font-size: 24px;
    font-weight: 700;
    color: var(--text-dark);
  }

  .hours {
    font-size: 17px;
    color: var(--text-gray);
    margin-bottom: 30px;
  }

  .btn-group {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 16px 20px;
    border-radius: 999px;
    font-size: 18px;
    font-weight: 700;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }

  .btn-line {
    background: #06c755;
    color: #fff;
  }

  .btn-call {
    background: var(--blue);
    color: #fff;
  }

  .btn-icon {
    width: 26px;
    height: 26px;
    flex-shrink: 0;
  }

  .btn-emoji {
    font-size: 22px;
    flex-shrink: 0;
  }
</style>
</head>
<body>

<div class="page">
  <div class="card">
    <h1>☎️ ติดต่อ รพ.สต.บ้านกลาง</h1>
    <div class="divider"></div>

    <div class="info-row">

    </div>

    <div class="btn-group">

  </div>
</div>

</body>
</html>
